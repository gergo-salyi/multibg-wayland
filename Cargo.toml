[package]
name = "multibg-wayland"
version = "0.2.5"
authors = ["Gergő Sályi <salyigergo94@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "Set a different wallpaper for the background of each Sway or Hyprland or niri workspace"
readme = "README.md"
homepage = "https://github.com/gergo-salyi/multibg-wayland"
repository = "https://github.com/gergo-salyi/multibg-wayland"
license = "MIT OR Apache-2.0"
keywords = ["wallpaper", "background", "desktop", "wayland", "sway"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["/PKGBUILD", "/PKGBUILD.in", "/deps/", "/scripts/"]

[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"

[features]
default = [
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm",
    "qoi", "tga", "tiff", "webp",
]
avif = ["image/avif-native"]
bmp = ["image/bmp"]
dds = ["image/dds"]
exr = ["image/exr"]
ff = ["image/ff"]
gif = ["image/gif"]
hdr = ["image/hdr"]
ico = ["image/ico"]
jpeg = ["image/jpeg"]
png = ["image/png"]
pnm = ["image/pnm"]
qoi = ["image/qoi"]
tga = ["image/tga"]
tiff = ["image/tiff"]
webp = ["image/webp"]

[dependencies]
anyhow = "1.0.97"
ash = "0.38.0"
clap = { version = "4.5.3", features = ["derive"] }
env_logger = {
    version = "0.11.3",
    default-features = false,
    features = ["auto-color"],
}
fast_image_resize = "6.0.0"
image = {
    version = "0.25.6",
    default-features = false,
}
libc = "0.2.171"
log = "0.4.21"
niri-ipc-25-2-0 = { package = "multibg-wayland-niri-ipc", version = "=0.250200.0" }
niri-ipc-25-5-1 = { package = "multibg-wayland-niri-ipc", version = "=0.250501.0" }
niri-ipc-25-8-0 = { package = "multibg-wayland-niri-ipc", version = "=0.250800.0" }
niri-ipc-26-4-0 = { package = "niri-ipc", version = "=26.4.0" }
rustix = { version = "1.0.8", features = ["event", "fs", "pipe"] }
scopeguard = "1.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
